# Netlify builds the site from GitHub on every push to main.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[functions]
  # Bundles the back end (netlify/functions/api.mjs) together with shared/rules.js.
  node_bundler = "esbuild"

[dev]
  command = "npx vite"
  targetPort = 5173
  port = 8888

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
